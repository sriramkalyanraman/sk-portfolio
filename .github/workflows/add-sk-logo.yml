name: Add SK logo to header

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update header
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          marker = '<div class="logo"><span class="dot"></span></div>'
          replacement = '<div class="logo"><span class="dot"></span><a class="logo-home" href="index.html" aria-label="Sriram Kalyanraman home"><img src="assets/sk-logo.svg" alt="SK"></a></div>'

          if marker not in s:
              raise SystemExit('Expected header logo markup was not found; no changes made.')

          s = s.replace(marker, replacement, 1)

          css_marker = '  .logo .dot{'
          css = '''  .logo-home{\n    display:flex; align-items:center; justify-content:center;\n    width:34px; height:34px; margin-left:2px;\n    text-decoration:none; border:1px solid var(--border-strong);\n    border-radius:3px; overflow:hidden; background:var(--panel);\n    transition:.15s;\n  }\n  .logo-home:hover{ border-color:var(--teal); }\n  .logo-home img{ width:27px; height:27px; display:block; object-fit:contain; }\n'''
          if css_marker not in s:
              raise SystemExit('Expected logo CSS marker was not found; no changes made.')
          s = s.replace(css_marker, css + css_marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove accidental screenshot asset
        run: |
          git rm -f assets/sk-logo-header.png || true

      - name: Commit site change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add linked SK logo to header"
          git push

      - name: Remove one-time workflow
        run: |
          git rm -f .github/workflows/add-sk-logo.yml
          git commit -m "Remove one-time logo update workflow"
          git push
