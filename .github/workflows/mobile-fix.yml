name: Fix mobile responsive markup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair responsive markup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          bad = re.search(r'<section[^>]*clamatrix[^>]*mobile-service-gridro[^>]*>', s)
          if bad:
              s = s[:bad.start()] + '<section class="hero wrap" style="border-top:none;">' + s[bad.end():]

          # Add the mobile service marker to the actual Freelance section only.
          sections = list(re.finditer(r'<section\b[^>]*>.*?</section>', s, re.S | re.I))
          for m in sections:
              block = m.group(0)
              if re.search(r'Freelance\s*&\s*advisory', block, re.I):
                  opening = re.match(r'<section\b[^>]*>', block, re.S | re.I).group(0)
                  if 'mobile-service-section' not in opening:
                      new_opening = re.sub(r'>$', ' class="mobile-service-section">', opening)
                      block = new_opening + block[len(opening):]
                      s = s[:m.start()] + block + s[m.end():]
                  break

          service_js = r'''
          <script>
          (() => {
            const section = [...document.querySelectorAll('section')].find(s => /Freelance\s*&\s*advisory/i.test(s.textContent));
            if (section) {
              const grid = [...section.querySelectorAll('*')].find(el => getComputedStyle(el).display === 'grid');
              if (grid) grid.classList.add('mobile-service-grid');
            }
          })();
          </script>
          '''
          if 'mobile-service-grid' not in s or 'Freelance\\s*&\\s*advisory' not in s:
              s = s.replace('</body>', service_js + '\n</body>', 1)
          elif 'const section = [...document.querySelectorAll(\'section\')]' not in s:
              s = s.replace('</body>', service_js + '\n</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit repair and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then git commit -m "Fix mobile responsive markup"; fi
          git rm -f .github/workflows/mobile-fix.yml .github/workflows/mobile-responsive.yml || true
          if ! git diff --cached --quiet; then git commit -m "Remove temporary mobile updater workflows"; fi
          git push
