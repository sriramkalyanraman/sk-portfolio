name: Apply mobile layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply mobile responsive changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'mobile-responsive-overrides' in s:
              print('Responsive changes already present.')
          else:
              nav = re.search(r'<div class="navlinks">(.*?)</div>', s, re.S)
              if not nav:
                  raise SystemExit('Navigation block not found')
              links = re.findall(r'<a\b[^>]*>.*?</a>', nav.group(1), re.S)
              if not links:
                  raise SystemExit('Navigation links not found')

              toggle = ('<button class="mobile-menu-toggle" type="button" aria-label="Open navigation" '
                        'aria-controls="mobileMenu" aria-expanded="false"><span></span><span></span><span></span></button>')
              menu = ('<div class="mobile-menu" id="mobileMenu" aria-hidden="true">'
                      '<div class="mobile-menu-links">' + ''.join(links) + '</div></div>')

              if 'mobile-menu-toggle' not in s:
                  s = s.replace('</nav>', toggle + '</nav>', 1)
                  s = s.replace('</nav>', '</nav>' + menu, 1)

              css = r'''
              /* ---------- mobile-responsive-overrides ---------- */
              @media (max-width:720px){
                html,body{width:100%;max-width:100%;overflow-x:hidden;}
                .wrap{padding-left:18px;padding-right:18px;}
                nav.wrap{height:58px;}
                .navlinks{display:none;}
                .logo{gap:8px;}
                .logo .dot{width:7px;height:7px;}
                .logo-home{width:32px;height:32px;margin-left:0;}
                .logo-home img{width:25px;height:25px;}

                .mobile-menu-toggle{display:flex;width:44px;height:44px;padding:0;margin-left:auto;align-items:center;justify-content:center;flex-direction:column;gap:5px;background:transparent;border:1px solid var(--border-strong);border-radius:4px;color:var(--text);cursor:pointer;-webkit-tap-highlight-color:transparent;}
                .mobile-menu-toggle span{display:block;width:18px;height:1px;background:var(--text-dim);transition:transform .18s ease,opacity .18s ease;}
                .mobile-menu-toggle[aria-expanded="true"] span:nth-child(1){transform:translateY(6px) rotate(45deg);}
                .mobile-menu-toggle[aria-expanded="true"] span:nth-child(2){opacity:0;}
                .mobile-menu-toggle[aria-expanded="true"] span:nth-child(3){transform:translateY(-6px) rotate(-45deg);}
                .mobile-menu-toggle[aria-expanded="true"]{border-color:var(--teal);}
                .mobile-menu{display:none;position:absolute;left:0;right:0;top:100%;background:rgba(10,14,18,.98);border-bottom:1px solid var(--border-strong);box-shadow:0 20px 35px -25px #000;padding:8px 18px 14px;}
                .mobile-menu.open{display:block;}
                .mobile-menu-links{display:grid;gap:2px;}
                .mobile-menu a{min-height:44px;display:flex;align-items:center;padding:10px 8px;text-decoration:none;color:var(--text-dim);border-bottom:1px solid var(--border);font-family:var(--mono);font-size:12px;letter-spacing:.03em;}
                .mobile-menu a:last-child{border-bottom:none;}
                .mobile-menu a:hover,.mobile-menu a:focus-visible{color:var(--teal);outline:none;}
                .mobile-menu .idx{color:var(--text-faint);margin-right:7px;}

                .hero{padding:52px 0 48px;}
                .hero-grid{grid-template-columns:1fr;gap:0;}
                .eyebrow{font-size:11px;margin-bottom:16px;gap:8px;}
                .eyebrow::before{width:20px;}
                h1{font-size:38px;line-height:1.08;max-width:14ch;}
                .hero-sub{margin-top:16px;font-size:15.5px;line-height:1.6;max-width:100%;}
                .hero-actions{margin-top:26px;gap:10px;}
                .btn{min-height:44px;padding:11px 16px;}
                .hero-actions .btn{flex:1 1 auto;justify-content:center;}
                .radar-wrap{max-width:200px;margin-top:34px;}
                .radar-label{bottom:-24px;font-size:10px;}

                .console{margin-top:46px;}
                .console-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
                .metric{min-width:0;padding:18px 14px;}
                .metric:nth-child(4n){border-right:1px solid var(--border);}
                .metric:nth-child(2n){border-right:none;}
                .metric:nth-last-child(-n+2){border-bottom:none;}
                .metric-label{font-size:9.5px;gap:5px;}
                .metric-value{font-size:22px;margin-top:6px;}
                .metric-value span{font-size:11px;}
                .console-feed{padding:12px 14px;font-size:10.5px;overflow-x:auto;}
                .console-feed .line{min-width:max-content;}

                section{padding:52px 0;}
                .section-head{gap:10px;margin-bottom:28px;}
                .section-num{font-size:11px;}
                .section-title{font-size:23px;}
                .profile-text{font-size:15px;line-height:1.65;}

                .entry{padding-left:20px;padding-bottom:30px;}
                .entry-body{padding:18px 16px;}
                .entry-role{font-size:16px;line-height:1.35;}
                .entry-org{font-size:11.5px;}
                .entry-loc{font-size:10.5px;}
                .entry-desc{font-size:14px;line-height:1.6;}
                .entry-list{gap:7px;}
                .entry-list li{font-size:13.5px;line-height:1.55;}
                .mobile-service-grid{grid-template-columns:1fr !important;}
                .mobile-service-grid > *{min-width:0;}
              }
              @media (max-width:420px){
                .wrap{padding-left:16px;padding-right:16px;}
                .hero{padding-top:44px;}
                h1{font-size:34px;}
                .hero-actions{flex-direction:column;align-items:stretch;}
                .hero-actions .btn{width:100%;}
                .metric{padding:16px 12px;}
                .metric-value{font-size:20px;}
                .section-title{font-size:22px;}
                .entry-body{padding:16px 14px;}
              }
              @media (min-width:721px){.mobile-menu-toggle,.mobile-menu{display:none !important;}}
              /* ---------- end mobile-responsive-overrides ---------- */
              '''
              s = s.replace('</style>', css + '\n</style>', 1)

              js = r'''
              <script>
              (() => {
                const toggle = document.querySelector('.mobile-menu-toggle');
                const menu = document.getElementById('mobileMenu');
                if (toggle && menu) {
                  const close = () => {
                    toggle.setAttribute('aria-expanded','false');
                    toggle.setAttribute('aria-label','Open navigation');
                    menu.classList.remove('open');
                    menu.setAttribute('aria-hidden','true');
                  };
                  toggle.addEventListener('click', () => {
                    const open = toggle.getAttribute('aria-expanded') === 'true';
                    toggle.setAttribute('aria-expanded', String(!open));
                    toggle.setAttribute('aria-label', open ? 'Open navigation' : 'Close navigation');
                    menu.classList.toggle('open', !open);
                    menu.setAttribute('aria-hidden', String(open));
                  });
                  menu.querySelectorAll('a').forEach(a => a.addEventListener('click', close));
                  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
                }
                const freelance = [...document.querySelectorAll('section')].find(s => /Freelance\s*&\s*advisory/i.test(s.textContent));
                if (freelance) {
                  const grid = [...freelance.querySelectorAll('*')].find(el => getComputedStyle(el).display === 'grid');
                  if (grid) grid.classList.add('mobile-service-grid');
                }
              })();
              </script>
              '''
              s = s.replace('</body>', js + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
              print('Mobile responsive design applied.')
          PY

      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Apply mobile responsive design"
          git rm -f .github/workflows/mobile-fix.yml .github/workflows/mobile-responsive.yml || true
          if ! git diff --cached --quiet; then git commit -m "Remove temporary mobile updater workflows"; fi
          git push
