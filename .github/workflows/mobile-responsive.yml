name: Apply mobile responsive design

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  mobile-responsive:
    if: ${{ !contains(github.event.head_commit.message, 'Apply mobile responsive design') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply responsive layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          if 'mobile-menu-toggle' in html or 'mobile-responsive-overrides' in html:
              print('Mobile responsive changes already present; nothing to do.')
              raise SystemExit(0)

          # Reuse the existing desktop navigation links for the mobile menu.
          nav_match = re.search(r'<div class="navlinks">(.*?)</div>', html, re.S)
          if not nav_match:
              raise SystemExit('Could not locate .navlinks in index.html')
          links = re.findall(r'<a\b[^>]*>.*?</a>', nav_match.group(1), re.S)
          if not links:
              raise SystemExit('Could not locate navigation links')

          mobile_links = ''.join(link.replace('class="idx"', 'class="idx"') for link in links)
          mobile_menu = (
              '<div class="mobile-menu" id="mobileMenu" aria-hidden="true">'
              '<div class="mobile-menu-links">' + mobile_links + '</div></div>'
          )

          toggle = (
              '<button class="mobile-menu-toggle" type="button" aria-label="Open navigation" '
              'aria-controls="mobileMenu" aria-expanded="false">'
              '<span></span><span></span><span></span></button>'
          )

          # Add the hamburger button to the existing nav and the mobile menu below it.
          nav_close = '</nav>'
          if nav_close not in html:
              raise SystemExit('Could not locate closing nav tag')
          html = html.replace(nav_close, toggle + nav_close, 1)
          html = html.replace(nav_close, nav_close + mobile_menu, 1)

          responsive_css = r'''
          /* ---------- mobile responsive overrides ---------- */
          @media (max-width:720px){
            html, body{ width:100%; max-width:100%; overflow-x:hidden; }
            .wrap{ padding-left:18px; padding-right:18px; }
            nav.wrap{ height:58px; }
            .navlinks{ display:none; }
            .logo{ gap:8px; }
            .logo .dot{ width:7px; height:7px; }
            .logo-home{ width:32px; height:32px; margin-left:0; }
            .logo-home img{ width:25px; height:25px; }

            .mobile-menu-toggle{
              display:flex; width:44px; height:44px; padding:0; margin-left:auto;
              align-items:center; justify-content:center; flex-direction:column; gap:5px;
              background:transparent; border:1px solid var(--border-strong); border-radius:4px;
              color:var(--text); cursor:pointer; -webkit-tap-highlight-color:transparent;
            }
            .mobile-menu-toggle span{
              display:block; width:18px; height:1px; background:var(--text-dim);
              transition:transform .18s ease, opacity .18s ease, background .18s ease;
            }
            .mobile-menu-toggle[aria-expanded="true"] span:nth-child(1){ transform:translateY(6px) rotate(45deg); }
            .mobile-menu-toggle[aria-expanded="true"] span:nth-child(2){ opacity:0; }
            .mobile-menu-toggle[aria-expanded="true"] span:nth-child(3){ transform:translateY(-6px) rotate(-45deg); }
            .mobile-menu-toggle[aria-expanded="true"]{ border-color:var(--teal); }

            .mobile-menu{
              display:none; position:absolute; left:0; right:0; top:100%;
              background:rgba(10,14,18,.98); border-bottom:1px solid var(--border-strong);
              box-shadow:0 20px 35px -25px #000; padding:8px 18px 14px;
            }
            .mobile-menu.open{ display:block; }
            .mobile-menu-links{ display:grid; gap:2px; }
            .mobile-menu a{
              min-height:44px; display:flex; align-items:center; padding:10px 8px;
              text-decoration:none; color:var(--text-dim); border-bottom:1px solid var(--border);
              font-family:var(--mono); font-size:12px; letter-spacing:.03em;
            }
            .mobile-menu a:last-child{ border-bottom:none; }
            .mobile-menu a:hover, .mobile-menu a:focus-visible{ color:var(--teal); outline:none; }
            .mobile-menu .idx{ color:var(--text-faint); margin-right:7px; }

            .hero{ padding:52px 0 48px; }
            .hero-grid{ grid-template-columns:1fr; gap:0; }
            .eyebrow{ font-size:11px; margin-bottom:16px; gap:8px; }
            .eyebrow::before{ width:20px; }
            h1{ font-size:38px; line-height:1.08; max-width:14ch; }
            .hero-sub{ margin-top:16px; font-size:15.5px; line-height:1.6; max-width:100%; }
            .hero-actions{ margin-top:26px; gap:10px; }
            .btn{ min-height:44px; padding:11px 16px; }
            .radar-wrap{ max-width:200px; margin-top:34px; }
            .radar-label{ bottom:-24px; font-size:10px; }

            .console{ margin-top:46px; }
            .console-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); }
            .metric{ min-width:0; padding:18px 14px; }
            .metric:nth-child(4n){ border-right:1px solid var(--border); }
            .metric:nth-child(2n){ border-right:none; }
            .metric:nth-last-child(-n+2){ border-bottom:none; }
            .metric-label{ font-size:9.5px; gap:5px; }
            .metric-value{ font-size:22px; margin-top:6px; }
            .metric-value span{ font-size:11px; }
            .console-feed{ padding:12px 14px; font-size:10.5px; overflow-x:auto; }
            .console-feed .line{ min-width:max-content; }

            section{ padding:52px 0; }
            .section-head{ gap:10px; margin-bottom:28px; }
            .section-num{ font-size:11px; }
            .section-title{ font-size:23px; }
            .profile-text{ font-size:15px; line-height:1.65; }

            .entry{ padding-left:20px; padding-bottom:30px; }
            .entry-body{ padding:18px 16px; }
            .entry-role{ font-size:16px; line-height:1.35; }
            .entry-org{ font-size:11.5px; }
            .entry-loc{ font-size:10.5px; }
            .entry-desc{ font-size:14px; line-height:1.6; }
            .entry-list{ gap:7px; }
            .entry-list li{ font-size:13.5px; line-height:1.55; }

            .mobile-service-grid{ grid-template-columns:1fr !important; }
            .mobile-service-grid > *{ min-width:0; }

            .hero-actions .btn{ flex:1 1 auto; justify-content:center; }
          }

          @media (max-width:420px){
            .wrap{ padding-left:16px; padding-right:16px; }
            .hero{ padding-top:44px; }
            h1{ font-size:34px; }
            .hero-actions{ flex-direction:column; align-items:stretch; }
            .hero-actions .btn{ width:100%; }
            .metric{ padding:16px 12px; }
            .metric-value{ font-size:20px; }
            .section-title{ font-size:22px; }
            .entry-body{ padding:16px 14px; }
          }

          @media (min-width:721px){
            .mobile-menu-toggle, .mobile-menu{ display:none !important; }
          }
          /* ---------- end mobile responsive overrides ---------- */
          '''

          style_marker = '</style>'
          if style_marker not in html:
              raise SystemExit('Could not locate closing style tag')
          html = html.replace(style_marker, responsive_css + '\n' + style_marker, 1)

          mobile_js = r'''
          <script>
          (() => {
            const toggle = document.querySelector('.mobile-menu-toggle');
            const menu = document.getElementById('mobileMenu');
            if (!toggle || !menu) return;

            const closeMenu = () => {
              toggle.setAttribute('aria-expanded', 'false');
              toggle.setAttribute('aria-label', 'Open navigation');
              menu.classList.remove('open');
              menu.setAttribute('aria-hidden', 'true');
            };

            toggle.addEventListener('click', () => {
              const open = toggle.getAttribute('aria-expanded') === 'true';
              toggle.setAttribute('aria-expanded', String(!open));
              toggle.setAttribute('aria-label', open ? 'Open navigation' : 'Close navigation');
              menu.classList.toggle('open', !open);
              menu.setAttribute('aria-hidden', String(open));
            });

            menu.querySelectorAll('a').forEach(link => link.addEventListener('click', closeMenu));
            document.addEventListener('keydown', event => {
              if (event.key === 'Escape') closeMenu();
            });
          })();
          </script>
          '''

          # Mark the freelance section and its actual grid without relying on its existing class name.
          section_pattern = r'(<section\b[^>]*>)(.*?Freelance\s*&(?:amp;)?\s*advisory.*?</section>)'
          section_match = re.search(section_pattern, html, re.S | re.I)
          if section_match:
              section = section_match.group(0)
              section = re.sub(r'(<section\b[^>]*)(>)', r'\1 class="mobile-service-section">', section, count=1)
              grid_match = re.search(r'<div\b[^>]*class="[^"]*"[^>]*>\s*(?:<[^>]+>\s*)*SVC\.01', section, re.S)
              if grid_match:
                  opening = re.search(r'<div\b[^>]*class="([^"]*)"', grid_match.group(0))
                  if opening:
                      old = opening.group(1)
                      new = old + ' mobile-service-grid'
                      section = section[:opening.start(1)] + new + section[opening.end(1):]
              html = html[:section_match.start()] + section + html[section_match.end():]

          if '</body>' not in html:
              raise SystemExit('Could not locate closing body tag')
          html = html.replace('</body>', mobile_js + '\n</body>', 1)

          path.write_text(html, encoding='utf-8')
          print('Applied mobile responsive design to index.html')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Apply mobile responsive design"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .github/workflows/mobile-responsive.yml ]; then
            git rm .github/workflows/mobile-responsive.yml
            git commit -m "Remove temporary mobile updater"
            git push
          fi
